# 테스트 프로필: DB 는 Testcontainers 가 전담 (datasource 는 @ServiceConnection 으로 주입). compose 자동 기동은 명시적으로 끈다.
spring:
  docker:
    compose:
      enabled: false

# ai 서버는 닫힌 포트로 두어 ai_reachable=false 경로를 검증한다.
beez:
  document:
    worker-enabled: false
    object-storage:
      endpoint: http://127.0.0.1:1
      bucket: beez-documents
      access-key: fixture-access
      secret-key: fixture-secret
  ai:
    base-url: http://127.0.0.1:1
    connect-timeout: 500ms
    read-timeout: 500ms

logging:
  level:
    com.beez: INFO
