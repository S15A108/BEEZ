spring:
  application:
    name: beez-backend
  profiles:
    default: local                # 아무것도 지정 안 하면 local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/beez}
    username: ${DB_USERNAME:beez}
    password: ${DB_PASSWORD:beez}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 가 만든다. 엔티티와 어긋나면 기동 실패.
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: UTC       # 시각은 UTC(Instant/timestamptz) 로 저장, 표시는 프론트가 한다

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    jdbc:
      initialize-schema: never    # 세션 테이블은 Flyway(V24)가 만든다
      cleanup-cron: "0 * * * * *" # 1분마다 만료 세션 행을 지운다 (expiry_time 인덱스)

  jackson:
    property-naming-strategy: SNAKE_CASE      # 프로토타입 API 와 동일 (decision_refs, task_id …)
    default-property-inclusion: non_null

  # SMTP 접속 (S15P31A108-219). beez.mail.mode=smtp 일 때만 쓴다. host 가 비면 JavaMailSender 가 만들어지지 않고 발송이 503 이 된다
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:true}
      # 기본값은 무한 대기다. 요청 스레드가 SMTP 에 묶이지 않게 끊는다
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

  # @Scheduled 워커(문서 색인·원본 정리·검증)가 기본 스레드 1개를 같이 쓰면, 검증 워커가 AI 응답을 기다리는 동안
  # 문서 색인이 멈춘다. 워커마다 스레드를 하나씩 쓰게 한다.
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}

  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only   # 서버를 껐다 켜도 DB 는 유지

  # 계정은 DB(account)에서 직접 확인한다. 기본 인메모리 사용자(+생성 비밀번호 로그)를 만들지 않는다.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  # 웹 세션 (Q04 제안안). PostgreSQL 에 저장해(spring.session.jdbc) 배포로 backend 가 바뀌어도 로그인이 유지된다 (-242).
  # 아래 만료·쿠키 값은 Spring Session 도 그대로 읽는다.
  servlet:
    session:
      timeout: 2h                 # 마지막 요청 후 2시간
      tracking-modes: cookie      # URL 에 ;jsessionid 를 붙이지 않는다
      cookie:
        name: BEEZ_SESSION
        http-only: true
        same-site: lax            # 다른 사이트에서 보낸 POST 에는 쿠키가 실리지 않는다 (CSRF 1차 방어)

management:
  endpoints:
    web:
      exposure:
        # prometheus 는 같은 8080 에서 연다(관리 포트 분리 안 함 — 헬스체크·Nginx·deploy.sh 가 8080 을 쓴다).
        # 외부 인터넷은 Nginx 가 /actuator/ 를 막고, 수집은 compose 네트워크 안에서 한다 (S15P31A108-262, docs/infra/cd.md)
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    # SMTP 가 잠깐 안 닿는다고 backend 를 DOWN 으로 보지 않는다 — 헬스체크(compose·deploy.sh)가 배포를 되돌리게 된다
    mail:
      enabled: false
  info:
    build:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %-32.32logger{32} : %m%n"
  level:
    com.beez: INFO

beez:
  document:
    object-storage:
      endpoint: ${DOCUMENT_S3_ENDPOINT:}
      region: ${DOCUMENT_S3_REGION:us-east-1}
      bucket: ${DOCUMENT_S3_BUCKET:}
      access-key: ${DOCUMENT_S3_ACCESS_KEY:}
      secret-key: ${DOCUMENT_S3_SECRET_KEY:}
    worker-enabled: ${DOCUMENT_WORKER_ENABLED:true}
    poll-millis: ${DOCUMENT_POLL_MILLIS:2000}
    embedding-profile: ${DOCUMENT_EMBEDDING_PROFILE:unconfigured}
    embedding-model: ${DOCUMENT_EMBEDDING_MODEL:unconfigured}
    embedding-dimension: 1024
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  validation:
    policy-analysis-enabled: ${VALIDATION_POLICY_ANALYSIS_ENABLED:false}
    worker-enabled: ${VALIDATION_WORKER_ENABLED:true}
    poll-millis: ${VALIDATION_POLL_MILLIS:2000}
    lease-seconds: ${VALIDATION_LEASE_SECONDS:120}      # AI 읽기 시간 초과(ai.read-timeout)보다 길게
    execution-budget-ms: ${VALIDATION_BUDGET_MS:15000}  # AI 에게 주는 처리 예산. 읽기 시간 초과보다 짧게
    # 같은 작업·같은 검증 입력으로 실제 검증 AI 를 부를 수 있는 횟수 (새 검증 요청 + 재시도 합계).
    # 가짜 분석기·AI 에 요청이 닿지 않은 실패·서버 중단으로 닫힌 실행은 세지 않는다 (읽기 시간 초과는 사용량이 없어도 센다)
    max-model-attempts: ${VALIDATION_MAX_MODEL_ATTEMPTS:3}
    # 서버용 가짜 분석기. AI 서버에 /v1/validate 가 붙기 전(-184)까지 개발 서버에서만 켠다.
    # 켜면 AI 를 부르지 않고 의미 분석이 필요한 검증도 후보 없이 PASS 로 끝난다(실제 설계 대조 없음). 운영에서는 끈다
    fake-analyzer: ${VALIDATION_FAKE_ANALYZER:false}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:change-me}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:20s}
  invitation:
    base-url: ${INVITE_BASE_URL:http://localhost:5173}   # 초대 링크 = {base-url}/invite?token=…
    ttl: ${INVITE_TTL:7d}
  mail:
    mode: ${MAIL_MODE:log}                         # smtp 면 실제로 보낸다. 로컬·테스트는 log (보내지 않음)
    from: ${MAIL_FROM:BEEZ <no-reply@beez.ai.kr>}
    log-body: false                                # 로그 구현이 본문(인증 코드)을 찍을지. local 프로필만 true
  # 가입 이메일 인증 (ACC-A11·A12). 코드 유효 5분만 명세 값이고 나머지는 Q04 가 정해지기 전 기본안이다
  email-verification:
    code-ttl: 5m
    resend-interval: ${EMAIL_VERIFY_RESEND_INTERVAL:60s}   # 명세 ACC-A11 응답 예시
    send-limit: ${EMAIL_VERIFY_SEND_LIMIT:5}               # 이메일당 send-limit-window 안 발송 수
    send-limit-window: 1h
    global-send-limit: ${EMAIL_VERIFY_GLOBAL_SEND_LIMIT:100}   # 서버 전체 send-limit-window 안 발송 수. SMTP 계정 한도보다 낮게
    max-attempts: ${EMAIL_VERIFY_MAX_ATTEMPTS:5}           # 틀린 입력 한도. FE 목과 같은 값
    token-ttl: 30m                                         # verified_token. 명세 ACC-A12 응답 예시
  # 비밀번호 찾기 — 임시 비밀번호 (ACC-A07, -171). Q04 가 정해지기 전 기본안. 한도는 가입 인증과 같은 값으로 시작한다
  password-recovery:
    ttl: 30m                    # 이 안에 임시 비밀번호로 로그인해야 한다
    resend-interval: 60s        # 같은 이메일 다시 요청 간격
    send-limit: 5               # 이메일당 send-limit-window 안 요청 수 (계정 유무와 관계없이 센다)
    send-limit-window: 1h
    global-send-limit: 100      # 서버 전체 send-limit-window 안 발송 수. SMTP 계정 한도보다 낮게
  agent:
    mcp-url: ${MCP_URL:http://localhost:8080/mcp}   # 토큰 발급 응답의 연결 URL (AGT-A01)
    max-active-tokens: ${AGENT_MAX_ACTIVE_TOKENS:5}  # 프로젝트당 한 계정의 폐기 안 된 토큰 수 (Q06)
