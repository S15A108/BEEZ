# 로컬 개발: SQL 로그, 상세 헬스
beez:
  mail:
    log-body: true   # 로컬은 메일을 보내지 않으므로 가입 인증 코드를 로그로 받는다. 다른 프로필에서는 켜지 않는다
  document:
    object-storage:
      endpoint: ${DOCUMENT_S3_ENDPOINT:http://127.0.0.1:8333}
      bucket: ${DOCUMENT_S3_BUCKET:beez-documents}
      access-key: ${DOCUMENT_S3_ACCESS_KEY:beez-local-access}
      secret-key: ${DOCUMENT_S3_SECRET_KEY:beez-local-secret}

logging:
  level:
    com.beez: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO
