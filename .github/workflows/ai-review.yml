# PR AI 리뷰 (Claude).
# - dev 대상 PR이 열릴 때(또는 Draft에서 Ready for review로 바뀔 때) 한 번 자동 리뷰한다.
# - 이후 PR에 `ai-review`가 들어간 댓글을 달면(저장소 소유자·멤버·협업자만) 그 시점 내용으로 다시 리뷰한다.
# - 계약·문서 정합성 검사 + 코드 버그 리뷰. 댓글만 달고 코드 수정·승인·머지는 하지 않는다.
#
# 준비: 저장소 Settings > Secrets and variables > Actions 에 CLAUDE_CODE_OAUTH_TOKEN 추가
#       (로컬에서 `claude setup-token` 으로 만든 구독 토큰. API 키를 쓰려면 ANTHROPIC_API_KEY 로 추가)
# 안전: PR 코드는 체크아웃·실행하지 않는다. 스크립트는 항상 dev 것을 쓰고, Claude는 도구를 모두 끈 채 글만 읽는다.
# 상세: .github/ai-review/README.md
name: AI Review

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [dev]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # 같은 저장소 브랜치의 PR만 자동 리뷰한다(fork PR은 secret이 전달되지 않는다).
    # 댓글 트리거는 PR 댓글이고, 봇이 아닌 소유자·멤버·협업자가 쓴 것만 받는다.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(github.event.comment.body, 'ai-review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 항상 dev(기준 브랜치)를 받는다. PR 브랜치 내용은 review.py 가 git 객체로만 읽는다.
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.319

      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          TRIGGER: ${{ github.event_name == 'issue_comment' && 'comment' || 'opened' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) as a repository secret."
            exit 1
          fi
          python3 .github/ai-review/review.py
