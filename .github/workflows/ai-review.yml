# PR AI 리뷰 (Claude).
# - dev 대상 PR이 열릴 때(또는 Draft에서 Ready for review로 바뀔 때) 한 번 자동 리뷰한다.
# - 이후 PR에 `/ai-review`로 시작하는 댓글을 달면(저장소 소유자·멤버·협업자만) 그 시점 내용으로 다시 리뷰한다.
# - 계약·문서 정합성 검사 + 코드 버그 리뷰. 댓글만 달고 코드 수정·승인·머지는 하지 않는다.
#
# 준비: 저장소 Settings > Secrets and variables > Actions 에 CLAUDE_CODE_OAUTH_TOKEN 추가
#       (로컬에서 `claude setup-token` 으로 만든 구독 토큰. API 키를 쓰려면 ANTHROPIC_API_KEY 로 추가)
#
# 안전: pull_request_target 은 워크플로 파일을 PR 이 아니라 기준 브랜치(dev)에서 읽는다. 그래서 PR 이 이 파일이나
#       review.py 를 고쳐도 그 PR 의 리뷰에는 반영되지 않는다(머지된 뒤부터 적용).
#       이 방식이 안전한 까닭은 PR 코드를 체크아웃하거나 실행하지 않기 때문이다. 이 워크플로에 PR 브랜치 체크아웃,
#       PR 코드 실행(npm install, gradlew 등)을 추가하면 secret 이 PR 작성자에게 노출될 수 있으니 넣지 말 것.
#       Claude 는 도구를 모두 끈 채 글만 읽는다.
# 한계: 이 워크플로가 dev 에 머지되기 전에는 동작하지 않는다(머지 전 시험은 review.py --local-base 로 로컬에서 한다).
# 상세: .github/ai-review/README.md
name: AI Review

on:
  pull_request_target:
    types: [opened, ready_for_review]
    branches: [dev]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # 같은 저장소 브랜치의 PR만 자동 리뷰한다(fork PR 은 제외).
    # 댓글 트리거는 PR 댓글이고, 봇이 아닌 소유자·멤버·협업자가 쓴 것 중 `/ai-review` 로 시작하는 것만 받는다.
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && startsWith(github.event.comment.body, '/ai-review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 항상 dev(기준 브랜치)를 받는다. PR 브랜치 내용은 review.py 가 git 객체로만 읽는다.
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.319

      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          TRIGGER: ${{ github.event_name == 'issue_comment' && 'comment' || 'opened' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) as a repository secret."
            exit 1
          fi
          python3 .github/ai-review/review.py
