name: Sync GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitlab
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'S15A108/BEEZ'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy branches and tags to GitLab
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ -z "$GITLAB_SYNC_TOKEN" ]]; then
            echo '::error::Add the GITLAB_SYNC_TOKEN repository secret before running synchronization.'
            exit 1
          fi

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          export GIT_ASKPASS="$workdir/askpass.sh"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*github.com*) printf '%s\n' 'x-access-token' ;;
            *Password*github.com*) printf '%s\n' "$GH_READ_TOKEN" ;;
            *Username*lab.ssafy.com*) printf '%s\n' 'oauth2' ;;
            *Password*lab.ssafy.com*) printf '%s\n' "$GITLAB_SYNC_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"

          # Clone current refs when this job starts, so queued jobs use fresh data.
          git -c credential.helper= clone --bare \
            https://github.com/S15A108/BEEZ.git "$workdir/source.git"
          git -C "$workdir/source.git" remote add gitlab \
            https://lab.ssafy.com/s15-final/S15P31A108.git
          # No --mirror, --force or --prune: refuse divergent history and keep
          # GitLab-only refs. Push heads and tags in one atomic operation.
          git -c credential.helper= -C "$workdir/source.git" push --atomic gitlab \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

          echo 'Branches and tags were synchronized to GitLab.' >> "$GITHUB_STEP_SUMMARY"
