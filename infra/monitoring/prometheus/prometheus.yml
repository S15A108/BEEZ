# Prometheus 수집 설정 (S15P31A108-263). 대상은 컨테이너 이름으로 찾는다(compose.yaml 네트워크 설명).
#
# 주기 15초: 243 지표의 DB 스냅샷 캐시가 15초라 더 짧게 긁어도 값이 바뀌지 않는다(docs/design/cdc-observability-243.md).
# 라벨 규칙(244 결정 4): 프로젝트 ID·문서 원문 같은 권한 밖 정보를 라벨로 붙이지 않는다. 여기서도 라벨을 더하지 않는다.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# 보존: 30일 또는 10GB 중 먼저 닿는 쪽에서 오래된 블록부터 지운다. 근거는 docs/infra/monitoring.md "보존 기간과 디스크".
# v3.15 부터 --storage.tsdb.retention.* 플래그는 deprecated 이고 이 설정이 대신한다
storage:
  tsdb:
    retention:
      time: 30d
      size: 10GB

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# 알림 규칙은 S15P31A108-264 에서 rule_files 로 더한다.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # backend 는 S15P31A108-262(#109) 가 8080 의 /actuator/prometheus 를 인증 없이 연다. 외부는 Nginx 가 막는다.
  # 같은 Docker 네트워크(beez_default)에서 서비스 이름 backend 로 닿는다. 호스트 포트(8081)·Nginx 를 거치지 않는다
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
