# 로컬 검증 전용 겹침 파일 (S15P31A108-263). 서버에서는 쓰지 않는다.
#
#   docker compose -f compose.yaml -f compose.local.yaml --env-file local.env up -d
#
# Docker Desktop(WSL2)은 루트를 rslave 로 붙이지 못해 node-exporter 가 뜨지 않는다
# ("path / is mounted on / but it is not a shared or slave mount"). 로컬은 rslave 를 뺀다.
# 서버(Ubuntu)는 rslave 로 붙여, 기동 뒤에 새로 마운트된 디스크도 node-exporter 가 본다.

services:
  node-exporter:
    volumes:
      - /:/host:ro
