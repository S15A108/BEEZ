# Alertmanager 설정 (S15P31A108-263 → 264). 알림 규칙은 prometheus/rules/beez.yml, 대응 절차는 docs/infra/monitoring-alerts.md.
#
# 수신처: Mattermost incoming webhook. v0.34 의 전용 연동(mattermost_configs)을 쓴다.
# 웹훅 주소는 비밀값이라 저장소에 없다. 서버 파일을 compose secret 으로 /run/secrets/mattermost_webhook_url 에 붙이고
# webhook_url_file 로 읽는다(compose.yaml, monitoring-alerts.md "웹훅 넣기"). 주소는 설정·로그·화면에 찍히지 않는다.
#
# 묶음·재통지
#   alertname 으로 묶는다. 같은 규칙이 여러 대상에서 울려도 한 글로 온다.
#   기본은 4시간마다 다시 알린다. FAILED·확인 필요 미평가는 남아 있는 것이 정상일 수 있는 "건수" 알림이라
#   처음 한 번 + 24시간마다(244 결정 4). 해소되면 해소 글을 보낸다.

route:
  receiver: mattermost
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 억제 원인 전용 알림은 글을 보내지 않는다(아래 inhibit_rules, rules/beez.yml)
    - matchers: ['alertname="CdcDataUnavailable"']
      receiver: "null"
    - matchers: ['alertname=~"CdcFailedIntakes|CdcNotEvaluatedRequiresReview"']
      receiver: mattermost
      repeat_interval: 24h

# 신선한 CDC 스냅샷이 어디에도 없는 동안(집계 실패·지표 누락·backend 다운) CDC 상태 알림을 억제한다.
# 값이 사라져 풀린 알림의 거짓 "해소" 글을 막으려는 것. 억제 중에 풀린 알림은 해소 글 없이 사라진다(2026-11-05 실측,
# docs/infra/monitoring-alerts.md "한계"). Kafka·인프라 알림은 억제하지 않는다
inhibit_rules:
  - source_matchers: ['alertname="CdcDataUnavailable"']
    target_matchers: ['alertname=~"CdcPendingDelay|CdcExpiredLeases|CdcBlockedProjects|CdcFailedIntakes|CdcNotEvaluatedRequiresReview"']

receivers:
  - name: "null"
  - name: mattermost
    mattermost_configs:
      - webhook_url_file: /run/secrets/mattermost_webhook_url
        send_resolved: true
        username: BEEZ 모니터링
        # 제목 링크는 런북의 그 알림 절. Alertmanager·Prometheus 화면은 SSH 터널로만 열려 Mattermost 에서 눌러도 열리지 않는다
        title: '{{ template "beez.title" . }}'
        # 알림 미리보기(푸시)에 나가는 줄. 기본값은 Alertmanager 내부 주소가 섞여 제목으로 바꾼다
        fallback: '{{ template "beez.title" . }}'
        title_link: 'https://github.com/S15A108/BEEZ/blob/dev/docs/infra/monitoring-alerts.md#{{ .CommonLabels.alertname | toLower }}'
        text: '{{ template "beez.text" . }}'

templates:
  - /etc/alertmanager/templates/*.tmpl
