# Grafana 데이터 소스 (S15P31A108-263). 화면에서 고치지 않고 이 파일로만 바꾼다(재기동 때 이 파일로 되돌아간다).
# 대시보드는 S15P31A108-264.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s   # prometheus.yml 의 scrape_interval 과 같게. 그래프의 최소 간격이 된다
