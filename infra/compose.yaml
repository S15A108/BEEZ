# BEEZ 전체 스택 — 기본 파일 (S15P31A108-120).
#
# 서버와 로컬이 같이 쓰는 뼈대다. 서버는 호스트 Nginx 가 앞에 서므로 이 파일에는 nginx 가 없다.
# 로컬 검증은 compose.local.yaml 을 겹쳐 nginx 를 더한다 (docs/infra/docker-images.md).
#
# 환경 중립 규칙: 서비스·볼륨 이름에 dev/prod 를 넣지 않는다. 환경 차이는 --env-file 로만 준다.
# 필수 값은 ${VAR:?} 로 적어 빠지면 compose 가 바로 멈춘다 (빈 값으로 뜨는 사고 방지).
# 비밀값을 이 파일에 쓰지 않는다.

name: beez

services:
  postgres:
    # backend/compose.yaml 과 같은 digest. 올릴 때 두 파일과 테스트의 DockerImageName 을 같이 바꾼다
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    # CDC(Debezium) 논리 복제용 설정 (S15P31A108-293, 계획 docs/infra/cdc-deploy-plan-279.md D4).
    # wal_level 은 재시작해야 바뀐다. 이 줄이 바뀐 PR 이 dev 에 머지되면 CD 가 postgres 를 다시 만드므로 머지 시각을 팀에 공지한다.
    # max_slot_wal_keep_size 는 슬롯이 멈춰도 WAL 이 디스크를 다 먹지 않게 두는 상한이다.
    # 되돌릴 때는 논리 복제 슬롯을 먼저 지운다. 슬롯이 남은 채 wal_level 을 내리면 PostgreSQL 이 기동을 거부한다
    # (순서는 docs/infra/cdc-postgres.md "되돌리기").
    # 이 command 는 서버(이 파일) 전용이다. 로컬 개발용 backend/compose.yaml 은 replica 그대로라 거기서는 슬롯을 만들 수 없다.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=10GB"]
    environment:
      POSTGRES_DB: ${DB_NAME:-beez}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    # S3 신원은 아래 configs 의 파일로만 준다(bootstrap·backend·backup 셋, docs/infra/seaweedfs.md). S15P31A108-211
    # telemetry=false: 기본값은 저장량 10 GiB 부터 하루 한 번 외부로 통계를 보낸다
    command: ["mini", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json", "-master.telemetry=false"]
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    environment:
      S3_BUCKET: ${DOCUMENT_S3_BUCKET:-beez-documents}
      # compose 는 configs 내용만 바뀐 것을 변경으로 보지 않아 키를 바꿔도 컨테이너를 다시 만들지 않는다.
      # 비밀이 아닌 access key 셋을 여기 두어, 키를 바꾸면 배포가 seaweedfs 를 다시 만들게 한다
      S3_CONFIG_ACCESS_KEYS: ${SEAWEEDFS_BOOTSTRAP_ACCESS_KEY}/${DOCUMENT_S3_ACCESS_KEY}/${SEAWEEDFS_BACKUP_ACCESS_KEY}
    volumes:
      - document-originals:/data
    networks:
      - storage
    healthcheck:
      # 인증 없이 200 을 주는 S3 헬스 경로. 신원 파일이 깨지면 S3 가 뜨지 않아 배포 --wait 가 실패한다
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # 포트를 열지 않는다. storage 네트워크에 붙은 backend 만 seaweedfs:8333 으로 닿는다.
    # filer(8888)는 인증 없이 객체를 읽고 쓰고 지울 수 있어, ai·postgres 와 같은 네트워크에 두지 않는다.

  ai:
    image: ${AI_IMAGE:-beez-ai:local}
    build: ../ai
    environment:
      GMS_KEY: ${GMS_KEY:-}
      GMS_CHAT_ENDPOINT: ${GMS_CHAT_ENDPOINT:-https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      # 기획 보완 질문(#133)·답변 반영 설계 초안(#134). 기본 꺼짐이라 켜지 않으면 두 경로가 503 이다.
      # dev 에서 켜려면 서버 env 파일에 =true 를 쓴다. 어느 환경에서 켤지는 AI 담당과 정한다.
      PLANNING_QUESTIONS_ENABLED: ${PLANNING_QUESTIONS_ENABLED:-false}
      DESIGN_DRAFTS_ENABLED: ${DESIGN_DRAFTS_ENABLED:-false}
      # 기획 분석 모델 호출의 시간(초)·출력 토큰 상한(추론 토큰 포함). 기본값은 실측으로 정한 코드 기본값과 같다 (S15P31A108-388).
      # 올릴 때는 backend BEEZ_PLANNING_QUESTION_READ_TIMEOUT·BEEZ_PLANNING_DRAFT_READ_TIMEOUT 을 함께 올려 backend 가 먼저 끊지 않게 한다
      PLANNING_QUESTIONS_LLM_TIMEOUT_SECONDS: ${PLANNING_QUESTIONS_LLM_TIMEOUT_SECONDS:-90}
      PLANNING_QUESTIONS_LLM_OUTPUT_TOKEN_LIMIT: ${PLANNING_QUESTIONS_LLM_OUTPUT_TOKEN_LIMIT:-8192}
      DESIGN_DRAFTS_LLM_TIMEOUT_SECONDS: ${DESIGN_DRAFTS_LLM_TIMEOUT_SECONDS:-150}
      DESIGN_DRAFTS_LLM_OUTPUT_TOKEN_LIMIT: ${DESIGN_DRAFTS_LLM_OUTPUT_TOKEN_LIMIT:-16384}
      # 작업 분해 모델 제한은 백엔드 워커의 읽기 제한(105초)보다 짧게 둔다.
      TASK_BREAKDOWN_LLM_TIMEOUT_SECONDS: ${TASK_BREAKDOWN_LLM_TIMEOUT_SECONDS:-90}
      TASK_BREAKDOWN_LLM_OUTPUT_TOKEN_LIMIT: ${TASK_BREAKDOWN_LLM_OUTPUT_TOKEN_LIMIT:-16384}
      # 역할 추천(#136)은 BE 계약 합의 전 기본 비활성이다.
      ASSIGNMENT_RECOMMENDATION_ENABLED: ${ASSIGNMENT_RECOMMENDATION_ENABLED:-false}
      # 비비 대화(#135, BEE-A01). 기본 꺼짐이라 켜지 않으면 /v1/bee/chat 이 503 이다. GMS_KEY 도 필요하다.
      BEE_CHAT_ENABLED: ${BEE_CHAT_ENABLED:-false}
      # MCP-01 개발 컨텍스트 선택(#131·#132, S15P31A108-399). 기본 꺼짐이고 한도 값은 기본이 없다 — 하나라도 비면 AI 가
      # 503 selection_not_configured, 에이전트는 get_development_context 에서 503 context_not_ready 를 받는다.
      # 켜려면 다섯 줄을 모두 서버 env 파일에 쓴다. GMS_KEY 도 필요하다. 선택 예산(TOTAL_TIMEOUT_SECONDS)은
      # backend BEEZ_DEVELOPMENT_CONTEXT_READ_TIMEOUT(40초)보다 짧게 둔다
      CONTEXT_SELECTION_ENABLED: ${CONTEXT_SELECTION_ENABLED:-false}
      CONTEXT_SELECTION_MIN_SIMILARITY: ${CONTEXT_SELECTION_MIN_SIMILARITY:-}
      CONTEXT_SELECTION_MAX_ITEMS: ${CONTEXT_SELECTION_MAX_ITEMS:-}
      CONTEXT_SELECTION_MAX_EVIDENCE: ${CONTEXT_SELECTION_MAX_EVIDENCE:-}
      CONTEXT_SELECTION_TOTAL_TIMEOUT_SECONDS: ${CONTEXT_SELECTION_TOTAL_TIMEOUT_SECONDS:-}
      # 문서 비비 검토(AI-A10) 모델 호출 제한(초, 상한 120). 첫 검토·재검토는 backend 워커가 HTTP 요청 밖에서 부르므로
      # backend DOCUMENT_REVIEW_WORKER_READ_TIMEOUT(120초)보다 짧게 둔다 (S15P31A108-391)
      DOCUMENT_REVIEW_LLM_TIMEOUT_SECONDS: ${DOCUMENT_REVIEW_LLM_TIMEOUT_SECONDS:-110}
      # 제안 대화·직접 요청(DISCUSS·REQUEST)은 사용자 요청 안에서 기다리므로 backend DOCUMENT_REVIEW_READ_TIMEOUT(55초)·nginx /api/(60초)보다 짧게
      DOCUMENT_REVIEW_CHAT_LLM_TIMEOUT_SECONDS: ${DOCUMENT_REVIEW_CHAT_LLM_TIMEOUT_SECONDS:-50}
      # 작업 계획 문서 초안 모델 호출 제한(초)과 출력 토큰 상한. backend TASK_PLAN_DRAFT_READ_TIMEOUT 보다 짧게 둔다 (S15P31A108-385)
      TASK_PLAN_DRAFTS_LLM_TIMEOUT_SECONDS: ${TASK_PLAN_DRAFTS_LLM_TIMEOUT_SECONDS:-30}
      TASK_PLAN_DRAFTS_LLM_OUTPUT_TOKEN_LIMIT: ${TASK_PLAN_DRAFTS_LLM_OUTPUT_TOKEN_LIMIT:-4096}
      TASK_PLAN_DRAFTS_LLM_OUTPUT_TOKEN_PARAMETER: ${TASK_PLAN_DRAFTS_LLM_OUTPUT_TOKEN_PARAMETER:-max_completion_tokens}
      TASK_PLAN_DRAFTS_LLM_REASONING_EFFORT: ${TASK_PLAN_DRAFTS_LLM_REASONING_EFFORT-low}
      TASK_PLAN_DRAFTS_INPUT_TOKEN_LIMIT: ${TASK_PLAN_DRAFTS_INPUT_TOKEN_LIMIT:-4096}
      TASK_PLAN_DRAFTS_INPUT_RESERVE_TOKENS: ${TASK_PLAN_DRAFTS_INPUT_RESERVE_TOKENS:-128}
      TASK_PLAN_DRAFTS_GOAL_CHARS: ${TASK_PLAN_DRAFTS_GOAL_CHARS:-160}
      TASK_PLAN_DRAFTS_APPROACH_CHARS: ${TASK_PLAN_DRAFTS_APPROACH_CHARS:-240}
      TASK_PLAN_DRAFTS_LIST_ITEMS: ${TASK_PLAN_DRAFTS_LIST_ITEMS:-3}
      TASK_PLAN_DRAFTS_LIST_ENTRY_CHARS: ${TASK_PLAN_DRAFTS_LIST_ENTRY_CHARS:-100}
      TASK_PLAN_DRAFTS_EVIDENCE_ITEMS: ${TASK_PLAN_DRAFTS_EVIDENCE_ITEMS:-5}
      TASK_PLAN_DRAFTS_QUOTE_CHARS: ${TASK_PLAN_DRAFTS_QUOTE_CHARS:-160}
      TASK_PLAN_DRAFTS_LINK_CANDIDATES: ${TASK_PLAN_DRAFTS_LINK_CANDIDATES:-3}
      TASK_PLAN_DRAFTS_REASON_CHARS: ${TASK_PLAN_DRAFTS_REASON_CHARS:-100}
      TASK_PLAN_DRAFTS_NEW_ITEMS: ${TASK_PLAN_DRAFTS_NEW_ITEMS:-3}
      TASK_PLAN_DRAFTS_UNLINKED_ITEMS: ${TASK_PLAN_DRAFTS_UNLINKED_ITEMS:-3}
      # 변경 영향 분석(#188, AI-A03 /v1/impact). 모델 이름이 있고 키를 구할 수 있어야(전용 키, 또는 GMS 주소 + GMS_KEY) 호출한다. 아니면 모델을 부르지 않고 502 model_unavailable 이다.
      # 기본은 꺼짐(모델 이름이 빈 값)이다. 켜려면 서버 env 파일에 IMPACT_LLM_MODEL 한 줄을 쓴다 — 주소를 따로 주지 않으면 GMS 주소를 쓴다.
      # 주소는 GMS_CHAT_ENDPOINT(문서 검토)를 따라가지 않게 따로 고정한다. 문서 검토 주소를 바꿔도 영향 분석은 그대로다.
      # 키는 여기서 GMS_KEY 로 채우지 않는다. 전용 키가 비면 ai 가 주소가 GMS 기본 주소와 똑같을 때만 GMS_KEY 를 쓰고,
      # 다른 주소면 모델을 부르지 않는다(팀 공용 키가 다른 서버로 나가지 않게, PR #258 리뷰).
      # 응답의 모델 이름이 요청과 다르게 오면 invalid_output 으로 거절되므로, 그때만 믿을 별칭을 ALLOWED_RESPONSE_MODELS 에 쉼표로 적는다 (S15P31A108-357)
      IMPACT_LLM_ENDPOINT: ${IMPACT_LLM_ENDPOINT:-https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions}
      IMPACT_LLM_API_KEY: ${IMPACT_LLM_API_KEY:-}
      IMPACT_LLM_MODEL: ${IMPACT_LLM_MODEL:-}
      IMPACT_LLM_ALLOWED_RESPONSE_MODELS: ${IMPACT_LLM_ALLOWED_RESPONSE_MODELS:-}
      # 모델 호출 시간(초)·출력 토큰 상한(추론 토큰 포함, 최대 4096). 기본값은 코드 기본값과 같다 (S15P31A108-402).
      # 시간을 올릴 때는 backend BEEZ_CHANGE_IMPACT_READ_TIMEOUT 도 함께 올려 backend 가 먼저 끊지 않게 한다
      IMPACT_LLM_TIMEOUT_SECONDS: ${IMPACT_LLM_TIMEOUT_SECONDS:-60}
      IMPACT_LLM_OUTPUT_TOKEN_LIMIT: ${IMPACT_LLM_OUTPUT_TOKEN_LIMIT:-4096}
    healthcheck:
      # slim 이미지에는 curl 이 없어 파이썬 표준 라이브러리로 확인한다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # 포트를 열지 않는다. backend 가 ai:8000 으로 부른다.

  backend:
    image: ${BACKEND_IMAGE:-beez-backend:local}
    build: ../backend
    networks:
      - default
      - storage   # seaweedfs 에 닿는 서비스는 backend 하나뿐이다
    depends_on:
      postgres:
        condition: service_healthy   # Flyway 가 기동 중에 DB 에 붙으므로 DB 가 준비된 뒤에 띄운다
      seaweedfs:
        # healthy 를 기다리지 않는다. seaweedfs 가 아파도 로그인·프로젝트 등 문서 밖 기능은 떠야 한다.
        # seaweedfs 이상은 그 자신의 healthcheck 로 배포 --wait 가 실패해 알려 준다
        condition: service_started
      ai:
        condition: service_started   # 기동에는 ai 가 필요 없다. 순서만 맞춘다
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-beez}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DOCUMENT_S3_ENDPOINT: http://seaweedfs:8333
      DOCUMENT_S3_BUCKET: ${DOCUMENT_S3_BUCKET:-beez-documents}
      DOCUMENT_S3_ACCESS_KEY: ${DOCUMENT_S3_ACCESS_KEY:?DOCUMENT_S3_ACCESS_KEY is required}
      DOCUMENT_S3_SECRET_KEY: ${DOCUMENT_S3_SECRET_KEY:?DOCUMENT_S3_SECRET_KEY is required}
      AI_BASE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      # 문서 색인 임베딩 프로필. AI 가 실제로 쓰는 값(gms-small-{dimension}-v1, GMS_EMBEDDING_MODEL)과 같아야 한다.
      # 다르면 AI 가 422 embedding_profile_mismatch, 비우면 백엔드가 embedding_profile_not_configured 로 색인을 멈춘다.
      # 차원은 백엔드(1024)·AI 기본값이 같으므로 여기서 바꾸지 않는다.
      DOCUMENT_EMBEDDING_PROFILE: ${DOCUMENT_EMBEDDING_PROFILE:-gms-small-1024-v1}
      DOCUMENT_EMBEDDING_MODEL: ${DOCUMENT_EMBEDDING_MODEL:-text-embedding-3-small}
      # 비비 질문(BEE-A01) 시간 설정. 기본 AI 호출 35초·전체 예산 55초(서버 Nginx 기본 60초보다 짧게). 서버 env 파일로 조정한다 (S15P31A108-344)
      BEEZ_BEE_CHAT_READ_TIMEOUT: ${BEEZ_BEE_CHAT_READ_TIMEOUT:-35s}
      BEEZ_BEE_ANSWER_BUDGET: ${BEEZ_BEE_ANSWER_BUDGET:-55s}
      # 문서 비비 검토 제안 대화·직접 요청의 AI 읽기 제한. AI DOCUMENT_REVIEW_CHAT_LLM_TIMEOUT_SECONDS(50초)보다 길게, nginx /api/ 대기(60초)보다 짧게 (S15P31A108-382)
      DOCUMENT_REVIEW_READ_TIMEOUT: ${DOCUMENT_REVIEW_READ_TIMEOUT:-55s}
      # 기획 보완 질문·설계 초안 AI 읽기 제한. ai 의 위 두 시간 제한보다 길고 작업 리스(300초)보다 짧게. 비동기 작업이라 nginx 와 무관하다 (S15P31A108-388)
      BEEZ_PLANNING_QUESTION_READ_TIMEOUT: ${BEEZ_PLANNING_QUESTION_READ_TIMEOUT:-105s}
      BEEZ_PLANNING_DRAFT_READ_TIMEOUT: ${BEEZ_PLANNING_DRAFT_READ_TIMEOUT:-170s}
      # 승인된 문서 4종에서 설계 항목 후보를 자동으로 만든다 (S15P31A108-389). 기본 꺼짐 — 유료 AI 호출이 나가므로 서버 env 파일에서만 true 로 켠다.
      # 켜면 기준 설계가 없고 4종이 승인·색인된 모든 프로젝트가 대상이다. 기존 프로젝트까지 한꺼번에 호출하지 않으려면 켜는 시각(ISO-8601, 예 2026-11-12T00:00:00Z)
      # 이후에 4종이 갖춰진 프로젝트만 보게 BEEZ_PLANNING_AUTO_DRAFT_APPROVED_AFTER 를 함께 둔다. 비우면 시각 제한이 없다
      BEEZ_PLANNING_AUTO_DRAFT_ENABLED: ${BEEZ_PLANNING_AUTO_DRAFT_ENABLED:-false}
      BEEZ_PLANNING_AUTO_DRAFT_APPROVED_AFTER: ${BEEZ_PLANNING_AUTO_DRAFT_APPROVED_AFTER:-}
      # 작업 분해 워커의 읽기 제한은 AI 모델 제한(90초)보다 길고 작업 리스보다 짧게 둔다.
      BEEZ_TASK_BREAKDOWN_READ_TIMEOUT: ${BEEZ_TASK_BREAKDOWN_READ_TIMEOUT:-105s}
      # 문서 비비 검토 워커(첫 검토·재검토)의 AI 읽기 제한. AI DOCUMENT_REVIEW_LLM_TIMEOUT_SECONDS(110초)보다 길게. nginx 와 무관 (S15P31A108-391)
      DOCUMENT_REVIEW_WORKER_READ_TIMEOUT: ${DOCUMENT_REVIEW_WORKER_READ_TIMEOUT:-120s}
      # 변경 영향 분석(재분석·발행 후 분석)의 AI 읽기 제한. AI IMPACT_LLM_TIMEOUT_SECONDS(60초)보다 길게. 백그라운드 실행이라 nginx 와 무관.
      # 실행 lease 도 이 값 + 연결 제한 + 1분으로 잡는다 (S15P31A108-402)
      BEEZ_CHANGE_IMPACT_READ_TIMEOUT: ${BEEZ_CHANGE_IMPACT_READ_TIMEOUT:-75s}
      # MCP-01 개발 컨텍스트 선택의 AI 읽기 제한. AI CONTEXT_SELECTION_TOTAL_TIMEOUT_SECONDS 보다 길게. /mcp 는 nginx 대기가 1시간이라
      # 60초 사슬과 무관하지만 에이전트 도구 호출 안에서 기다리는 동기 호출이다 (S15P31A108-399)
      BEEZ_DEVELOPMENT_CONTEXT_READ_TIMEOUT: ${BEEZ_DEVELOPMENT_CONTEXT_READ_TIMEOUT:-40s}
      # MCP-01 호출 한도. (에이전트 토큰, 프로젝트)마다 창 안 횟수, 넘으면 429 rate_limited (S15P31A108-399)
      BEEZ_DEVELOPMENT_CONTEXT_RATE_LIMIT: ${BEEZ_DEVELOPMENT_CONTEXT_RATE_LIMIT:-6}
      BEEZ_DEVELOPMENT_CONTEXT_RATE_LIMIT_WINDOW: ${BEEZ_DEVELOPMENT_CONTEXT_RATE_LIMIT_WINDOW:-1m}
      # 작업 계획 문서 초안 AI 호출 읽기 제한. AI TASK_PLAN_DRAFTS_LLM_TIMEOUT_SECONDS(30초)보다 길게, nginx /api/ 대기(60초)보다 짧게 (S15P31A108-385)
      TASK_PLAN_DRAFT_READ_TIMEOUT: ${TASK_PLAN_DRAFT_READ_TIMEOUT:-40s}
      TASK_PLAN_DRAFT_MAX_CALLS_PER_HOUR: ${TASK_PLAN_DRAFT_MAX_CALLS_PER_HOUR:-20}
      TASK_PLAN_DRAFT_RETRIEVAL_LIMIT: ${TASK_PLAN_DRAFT_RETRIEVAL_LIMIT:-12}
      TASK_PLAN_DRAFT_MAX_EXCERPT_CHARS: ${TASK_PLAN_DRAFT_MAX_EXCERPT_CHARS:-4000}
      TASK_PLAN_DRAFT_TOTAL_EXCERPT_CHARS: ${TASK_PLAN_DRAFT_TOTAL_EXCERPT_CHARS:-12000}
      TASK_PLAN_DRAFT_MAX_DESIGN_ITEMS: ${TASK_PLAN_DRAFT_MAX_DESIGN_ITEMS:-100}
      TASK_PLAN_DRAFT_DESIGN_SUMMARY_CHARS: ${TASK_PLAN_DRAFT_DESIGN_SUMMARY_CHARS:-300}
      TASK_PLAN_DRAFT_SELECTED_EXCERPTS: ${TASK_PLAN_DRAFT_SELECTED_EXCERPTS:-6}
      TASK_PLAN_DRAFT_SIMILARITY_DROP: ${TASK_PLAN_DRAFT_SIMILARITY_DROP:-0.15}
      TASK_PLAN_DRAFT_LEXICAL_WEIGHT: ${TASK_PLAN_DRAFT_LEXICAL_WEIGHT:-0.2}
      # 공개 주소 셋. prod 프로필은 기본값이 없어 빠지면 기동이 실패한다
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      INVITE_BASE_URL: ${PUBLIC_ORIGIN}
      MCP_URL: ${PUBLIC_ORIGIN}/mcp
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # 검증 가짜 분석기. AI /v1/validate(-184)가 붙기 전까지 개발 서버 env 파일에서만 true 로 둔다 (기본 false)
      VALIDATION_FAKE_ANALYZER: ${VALIDATION_FAKE_ANALYZER:-false}
      # CDC 분석 접수 (S15P31A108-298, 계획 docs/infra/cdc-deploy-plan-279.md D7). 기본은 둘 다 꺼짐 — 켜는 값은 서버 env 파일에만 둔다.
      # ENABLED = 복구 스캔(분석 접수 처리), CONSUMER_ENABLED = Kafka 힌트 consumer. consumer 만 켜면 backend 가 기동을 거부한다.
      # consumer 를 켜도 Kafka 가 없으면 기동은 하고(스캔이 처리) 30초마다 연결을 다시 시도한다. 나머지 셋은 비밀이 아닌 D7 값
      BEEZ_CDC_INTAKE_ENABLED: ${BEEZ_CDC_INTAKE_ENABLED:-false}
      BEEZ_CDC_INTAKE_CONSUMER_ENABLED: ${BEEZ_CDC_INTAKE_CONSUMER_ENABLED:-false}
      BEEZ_CDC_INTAKE_BOOTSTRAP_SERVERS: ${BEEZ_CDC_INTAKE_BOOTSTRAP_SERVERS:-kafka:9092}
      BEEZ_CDC_INTAKE_GROUP_ID: ${BEEZ_CDC_INTAKE_GROUP_ID:-beez-published-analysis}
      BEEZ_CDC_INTAKE_TOPIC: ${BEEZ_CDC_INTAKE_TOPIC:-beez.public.published_change_analysis}
      # 가입 인증 메일 SMTP (S15P31A108-272). 비어 있어도 기동은 하고, prod 는 발송만 503 mail_send_failed 가 된다(-219).
      # MAIL_MODE 는 넘기지 않는다: prod 프로필은 smtp, 로컬 compose(local 프로필)는 log 가 기본이다.
      # MAIL_FROM 은 SMTP 인증 계정 주소와 맞춘다 — 다르면 메일 제공자가 거부한다
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-BEEZ <no-reply@beez.ai.kr>}"
      EMAIL_VERIFY_GLOBAL_SEND_LIMIT: ${EMAIL_VERIFY_GLOBAL_SEND_LIMIT:-100}   # 서버 전체 시간당 발송 상한. SMTP 계정 한도보다 낮게
      # IP 하나의 시간당 가입 인증(ACC-A11)+비밀번호 찾기(ACC-A07) 요청 수 (Q04, -273). 시연처럼 한 공유기 뒤에서 여럿이 가입할 때 올린다
      AUTH_IP_LIMIT: ${AUTH_IP_LIMIT:-10}
      # 초대한 계정 하나의 시간당 초대 메일 수(MEM-A01 새 초대 + MEM-A11 다시 보내기, Q05·-334). 시연에서 한 계정이 많이 초대할 때 올린다
      INVITE_SEND_LIMIT: ${INVITE_SEND_LIMIT:-30}
    ports:
      # 127.0.0.1 에만 연다. 서버는 BACKEND_HOST_PORT=8081 이고 호스트 Nginx 가 그리로 프록시한다(S15P31A108-123).
      # 기본값을 두지 않는다. 기본값 8080 은 서버의 Jenkins 와 겹치는데 env 점검(config)을 통과해 버렸다 (S15P31A108-27)
      - "127.0.0.1:${BACKEND_HOST_PORT:?BACKEND_HOST_PORT is required}:8080"
    # Spring graceful shutdown 은 진행 중 요청을 최대 20초(spring.lifecycle.timeout-per-shutdown-phase) 기다리고,
    # 이어서 보내던 메일을 종료 시작부터 25초까지 기다린다(beez.mail.shutdown-wait, -334). 그 합보다 길게 둔다.
    # docker stop 기본 대기 10초면 AI 호출 같은 긴 요청과 보내던 메일이 배포 중 잘린다
    stop_grace_period: 30s
    healthcheck:
      # temurin 이미지에는 curl 이 들어 있다. 상태 UP 이면 200, DB 가 끊기면 503
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  document-originals:

networks:
  default:
  storage:
    # 바깥으로 나가는 길이 없는 내부망. seaweedfs·backend 와 백업 스크립트의 rclone 만 붙는다 (infra/backup/backup.sh)
    internal: true

configs:
  # SeaweedFS S3 신원 파일. 값은 env 파일에서 채워 컨테이너 안에만 만든다(docker inspect 에 비밀값이 보이지 않는다).
  # 값은 openssl rand -hex 로 만든 16진수라 JSON 안에서 따옴표·역슬래시 문제가 없다 (docs/infra/cd.md 2. env 파일)
  seaweedfs-s3:
    content: |
      {"identities": [
        {"name": "bootstrap",
         "credentials": [{"accessKey": "${SEAWEEDFS_BOOTSTRAP_ACCESS_KEY:?SEAWEEDFS_BOOTSTRAP_ACCESS_KEY is required}",
                          "secretKey": "${SEAWEEDFS_BOOTSTRAP_SECRET_KEY:?SEAWEEDFS_BOOTSTRAP_SECRET_KEY is required}"}],
         "actions": ["Admin", "Read", "List", "Tagging", "Write"]},
        {"name": "backend",
         "credentials": [{"accessKey": "${DOCUMENT_S3_ACCESS_KEY:?DOCUMENT_S3_ACCESS_KEY is required}",
                          "secretKey": "${DOCUMENT_S3_SECRET_KEY:?DOCUMENT_S3_SECRET_KEY is required}"}],
         "actions": ["Read:${DOCUMENT_S3_BUCKET:-beez-documents}", "Write:${DOCUMENT_S3_BUCKET:-beez-documents}",
                     "List:${DOCUMENT_S3_BUCKET:-beez-documents}"]},
        {"name": "backup",
         "credentials": [{"accessKey": "${SEAWEEDFS_BACKUP_ACCESS_KEY:?SEAWEEDFS_BACKUP_ACCESS_KEY is required}",
                          "secretKey": "${SEAWEEDFS_BACKUP_SECRET_KEY:?SEAWEEDFS_BACKUP_SECRET_KEY is required}"}],
         "actions": ["Read:${DOCUMENT_S3_BUCKET:-beez-documents}", "List:${DOCUMENT_S3_BUCKET:-beez-documents}"]}
      ]}
