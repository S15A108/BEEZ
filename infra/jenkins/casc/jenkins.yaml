# Jenkins 설정 코드 (JCasC, S15P31A108-126).
# 서버 위치: /etc/jenkins/casc/jenkins.yaml. Jenkins 가 켜질 때마다 이 파일대로 설정을 덮어쓴다.
# 화면에서 바꾼 보안 설정은 재시작하면 이 파일 값으로 돌아간다 — 바꿀 때는 이 파일을 고친다.
#
# 비밀값은 여기에 쓰지 않는다. ${...} 는 서버의 /etc/jenkins/casc.env(root 전용)에서 systemd 가 넘겨준다.
# 환경 중립: 서버 역할(dev/prod)을 적지 않는다. 주소는 jenkins.beez.ai.kr 하나뿐이다.

jenkins:
  systemMessage: "BEEZ Jenkins. 설정은 저장소 infra/jenkins/casc/jenkins.yaml 로 관리합니다."
  # 배포 잡만 돌리므로 동시 실행은 2개면 충분하다
  numExecutors: 2

  # 로그인 계정: Jenkins 자체 사용자 DB. 가입 화면을 막는다
  #   관리자 1명 + GitHub Actions 가 배포 잡을 부를 때 쓰는 계정(S15P31A108-123).
  #   github-actions 의 비밀번호는 API 토큰을 처음 만들 때만 쓴다. Actions 는 토큰으로 부른다 (docs/infra/cd.md).
  #   casc.env 에 JENKINS_DEPLOY_PASSWORD 를 먼저 넣고 이 파일을 반영한다 — 값이 없으면 비밀번호가 빈 계정이 된다.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "github-actions"
          password: "${JENKINS_DEPLOY_PASSWORD}"

  # 권한 (matrix-auth, S15P31A108-123). 적힌 것만 허용하고, 로그인하지 않으면 아무것도 볼 수 없다.
  #   관리자: 전부.
  #   github-actions: 전체에서는 읽기만. 실행 권한은 beez-deploy 잡에만 준다(아래 jobs 의 authorizationMatrix).
  #   GitHub 시크릿에 든 토큰이 새도 할 수 있는 일은 "dev 에 들어온 커밋 중 하나로 다시 배포"뿐이다(아래 jobs 의 refspec).
  # (예전 설정 loggedInUsersCanDoAnything 은 로그인한 계정이면 누구나 관리자였다 — 계정이 둘이 되며 바꿨다)
  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
        - user:
            name: "github-actions"
            permissions:
              - "Overall/Read"

  # 외부 에이전트 접속 포트를 쓰지 않는다 (빌드는 이 서버의 내장 실행기만 쓴다)
  slaveAgentPort: -1

  # CSRF 방어(crumb)는 현재 Jenkins 코어에서 항상 켜져 있어 따로 적지 않는다.
  # (예전 예제의 crumbIssuer.standard.excludeClientIPFromCrumb 는 지금 코어에 없는 항목이라 적으면 기동이 실패한다)

unclassified:
  # 알림·링크에 쓰이는 공개 주소. Nginx 뒤 HTTPS 주소를 적는다
  location:
    url: "https://jenkins.beez.ai.kr/"

# 배포 잡 (S15P31A108-123). Job DSL 로 정의하고, Jenkins 가 켜질 때마다 이 정의로 다시 만든다(화면에서 고친 잡 설정은 되돌아간다).
# Jenkinsfile 은 저장소에서 "배포할 SHA 그 커밋"으로 읽는다 → 브랜치 지정에 GIT_SHA 파라미터를 넣는다.
#   ^${GIT_SHA} : JCasC 의 변수 치환을 피하는 표기. Jenkins 에는 ${GIT_SHA} 로 들어가 빌드할 때 파라미터 값으로 바뀐다.
#   lightweight(false) : 파라미터가 든 브랜치 지정은 전체 체크아웃에서만 펼쳐진다.
# 받는 범위를 dev 브랜치로 묶는다(refspec + honorRefspec, 태그 받지 않음). 그래서 GIT_SHA 는 dev 에 들어온(PR 리뷰를 거친) 커밋만 된다.
#   묶지 않으면 아무 브랜치·태그의 커밋을 넣을 수 있고, 그 커밋의 Jenkinsfile 이 jenkins(docker 그룹 = 사실상 root)로 실행된다.
#   이 설정을 바꾼 뒤에는 서버의 잡 작업 폴더(/var/lib/jenkins/workspace/beez-deploy*)를 한 번 지운다 — 예전에 받아 둔 커밋이 남는다.
# 환경 중립: 환경·타깃은 파라미터다. 운영을 붙일 때 선택지와 받는 브랜치(main)를 늘린다(prod, ssh 타깃).
jobs:
  - script: |
      pipelineJob('beez-deploy') {
        description('커밋 SHA 하나의 이미지 셋(backend·ai·frontend-dist)을 배포한다. GitHub Actions(cd.yml)가 부른다. 런북: docs/infra/cd.md')
        parameters {
          stringParam('GIT_SHA', '', '배포할 커밋 SHA 40자. dev 에 있는 커밋이어야 하고, 그 커밋의 이미지가 GHCR 에 있어야 한다')
          choiceParam('DEPLOY_ENV', ['dev'], '환경. 서버의 /opt/beez/.env.<환경> 을 쓴다')
          choiceParam('TARGET', ['local'], '배포할 서버. local = 이 서버')
        }
        logRotator { numToKeep(50) }
        properties {
          disableConcurrentBuilds()
          // github-actions 는 이 잡만 보고 실행할 수 있다 (전체 권한은 위 authorizationStrategy)
          authorizationMatrix {
            inheritanceStrategy { inheriting() }
            entries {
              user {
                name('github-actions')
                permissions(['Job/Read', 'Job/Build'])
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/S15A108/BEEZ.git')
                  refspec('+refs/heads/dev:refs/remotes/origin/dev')
                }
                branch('^${GIT_SHA}')
                extensions {
                  // 처음 받을 때도 위 refspec 만 받고(honorRefspec), 태그는 받지 않는다(태그로 다른 커밋을 끌어오지 못하게)
                  cloneOptions {
                    honorRefspec(true)
                    noTags(true)
                    shallow(false)
                  }
                }
              }
            }
            scriptPath('infra/deploy/Jenkinsfile')
            lightweight(false)
          }
        }
      }
