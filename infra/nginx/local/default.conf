# 로컬 compose 전용 nginx 설정 (S15P31A108-120). 서버 설정의 정본은 sites-available/ 이다.
# 정적 파일 부분과 /api·/actuator/health 프록시는 sites-available/dev.beez.ai.kr.conf 와 같은 역할이다.
# 서버는 호스트 Nginx 가 127.0.0.1 의 backend 로 넘긴다 (S15P31A108-123, docs/infra/cd.md).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드 API. 컨테이너 이름(backend)으로 찾는다.
    location /api/ {
        # 경로의 ; \ 우회를 막는다. 서버는 snippets/beez-backend-proxy.conf 에 같은 규칙이 있다 (S15P31A108-262)
        if ($request_uri ~ "^[^?]*(;|\x5c|%3[Bb]|%5[Cc])") {
            return 400;
        }
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # backend 가 forward 헤더를 믿으므로 Host·Port 도 덮어쓴다 (서버 snippets/beez-backend-proxy.conf 와 같음, -273)
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # 대기 시간 사슬 (S15P31A108-382): AI 문서 검토 모델 30초 < backend 읽기 40초 < 여기 60초.
        # 바깥이 안쪽보다 짧으면 nginx 가 먼저 504 를 내고 backend 는 계속 돌아 비용만 나간다. 값을 올릴 때는 안쪽부터 올린다
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 연결 확인용 헬스만 연다. 서버도 같다.
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 나머지 /actuator/ 는 막는다(/actuator/prometheus 포함). 서버도 같다 (S15P31A108-262)
    location ^~ /actuator/ {
        return 404;
    }

    # 아래는 dev.beez.ai.kr.conf 와 같다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
