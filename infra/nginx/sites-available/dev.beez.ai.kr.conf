# HTTP는 인증서 발급 경로만 남기고 HTTPS로 넘긴다.
server {
    listen 80;
    listen [::]:80;
    server_name dev.beez.ai.kr;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 프론트 정적 파일(dist) 서빙. 배포는 /var/www/beez/releases/<sha>에 풀고 current 심링크를 바꾼다.
# 인증서는 certbot certonly --webroot로 발급하며 certbot은 이 파일을 수정하지 않는다.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.beez.ai.kr;

    ssl_certificate /etc/letsencrypt/live/dev.beez.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.beez.ai.kr/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/beez/current;
    index index.html;

    # SPA fallback: 파일이 없는 경로는 index.html로 넘겨 클라이언트 라우터가 처리한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 결과물은 파일명에 해시가 붙어 있어 오래 캐시해도 된다.
    # 없는 파일은 index.html 대신 404를 돌려 MIME 오류를 막는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html은 매번 재검증해 새 배포가 바로 반영되게 한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
