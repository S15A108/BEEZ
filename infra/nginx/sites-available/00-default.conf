# 등록되지 않은 호스트(IP 직접 접속, 스캐너 등)는 응답 없이 연결을 끊는다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

# HTTPS도 같다. 인증서 없이 TLS 핸드셰이크 단계에서 거절해 다른 호스트의 인증서를 내보이지 않는다.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_reject_handshake on;
}
