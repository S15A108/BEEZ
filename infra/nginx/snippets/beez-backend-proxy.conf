# backend 프록시 공통 설정 — 경로 검사(-262)와 헤더(-123). dev.beez.ai.kr.conf 의 /api·/mcp·/actuator/health 가 함께 쓴다.
# backend 로 넘기는 location 은 이 파일을 빼지 않는다. 빼면 아래 우회 차단도 함께 빠진다.

# 경로에 ; 나 \ (인코딩 %3B·%5C 포함)가 든 요청은 backend 에 넘기지 않는다 (S15P31A108-262).
# Nginx 는 정규화한 경로로 location 을 고르지만 proxy_pass 는 원래 경로를 넘기고, Tomcat 은 ; 뒤를 경로 매개변수로 지운다.
# 그래서 /api/;/../actuator/prometheus 가 /api/ 로 들어와 backend 에서 /actuator/prometheus 가 된다.
# Spring 방화벽도 400 으로 막지만 외부 차단을 Nginx 에서 한 번 더 지킨다. 쿼리 문자열(? 뒤)은 보지 않는다.
# 역슬래시는 \x5c 로 적는다. 따옴표 안의 \\ 는 Nginx 가 \ 하나로 바꿔 정규식에서 | 를 글자로 만든다
if ($request_uri ~ "^[^?]*(;|\x5c|%3[Bb]|%5[Cc])") {
    return 400;
}

proxy_http_version 1.1;
# Connection 헤더를 비워야 upstream keepalive 연결이 재사용된다 ('close' 를 보내면 매번 끊긴다)
proxy_set_header Connection "";

# 원래 요청 정보를 backend 에 넘긴다 (접속 IP 기록, https 여부 판단)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# backend 는 위 헤더를 믿는다(server.forward-headers-strategy=native, S15P31A108-273). Tomcat 은 Host·Port 헤더도 믿으므로
# 클라이언트가 보낸 값이 getServerName()·포트가 되지 않게 덮어쓴다 (jenkins.beez.ai.kr.conf 와 같음)
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
